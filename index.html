<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Exercícios - Nível 1 Básico</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Nível 1 — Básico</h1>

  <div class="atividade">
    <h2>Atividade 1 — Maioridade</h2>
    <p>Verificador de idade</p>
    <input type="number" id="Idade" placeholder="Digite sua idade">
 
    <button onclick="verificarIdade()">Verificar</button>
 
    <p id="Resultado"></p>
 
    </div>

  <div class="atividade">
    <h2>Atividade 2 — Número positivo, negativo ou zero</h2>
    <p>Identificar números</p>

    <input type="number" id="number" placeholder="Digite seu número">
 
    <button onclick="verificarNumero()">Verificar</button>
 
    <p id="ResultadoNumeros"></p>
  </div>

  <div class="atividade">
    <h2>Atividade 3 — Aprovação do aluno</h2>
    <p>Aprovador</p>

    <input type="number" id="nota" placeholder="Digite sua Nota aqui">
 
    <button onclick="verificarNotaAluno()">Verificar</button>
 
    <p id="ResultadoNota"></p>
  </div>

    <div class="atividade">
    <h2>Atividade 4 — Sistema de prioridade</h2>
    <p>Prioridades</p>

    <label for="campoPrioridade">Digite a prioridade (urgente, alta, media, baixa):</label>
    <br>
    <input type="text" id="prioridade">
 
    <button onclick="verificarPrioridade()">Verificar</button>
 
    <p id="Resultado"></p>
  </div>

<script src="script.js"></script>
</body>
</html>
